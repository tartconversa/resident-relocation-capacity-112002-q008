[project]
name = "renewal-analytics-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
renewal-analytics = "renewal_analytics.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
